<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="ggrad2" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#0B5395" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B5395" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <!-- Right Image and Scrim -->
  <g id="chapter-image">
    <svg x="560" y="0" width="720" height="720" viewBox="0 0 1 1" preserveAspectRatio="none">
      <image href="assets/image2.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none"/>
    </svg>
    <rect x="560" y="0" width="720" height="720" fill="url(#ggrad2)"/>
  </g>

  <!-- Left Chapter Label & Title -->
  <g id="chapter-title-group">
    <rect x="60" y="160" width="6" height="280" fill="#00B0F0"/>
    <text x="80" y="190" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="24" fill="#00B0F0" font-weight="700" letter-spacing="4">{{CHAPTER_LABEL}}</text>
    <text x="80" y="290" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="96" fill="#0B5395" font-weight="bold" line-height="1">{{CHAPTER_NUM}}</text>
    <text x="80" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="38" fill="#0B5395" font-weight="bold">{{CHAPTER_TITLE}}</text>
    <text x="80" y="425" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#666666">{{CHAPTER_SUBTITLE}}</text>
  </g>

  <!-- Accent circles and labels -->
  <g id="chapter-decorations">
    <ellipse cx="1253" cy="42" rx="17" ry="17" fill="#FFFFFF" fill-opacity="0" stroke-width="2" stroke="#00B0F0"/>
    <text x="1220" y="48" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#666666">内部销售方案培训</text>
    <text x="80" y="600" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#00B0F0" font-weight="700">{{CHAPTER_INDICATOR}}</text>
  </g>

  <!-- Page Footer -->
  <g id="page-footer">
    <line x1="60" y1="650" x2="1220" y2="650" stroke="#E0E0E0" stroke-width="1"/>
    <text x="60" y="685" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">内部销售培训专用</text>
    <text x="1220" y="685" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">03</text>
  </g>
</svg>
