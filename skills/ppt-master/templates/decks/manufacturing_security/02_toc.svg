<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <!-- Page Header -->
  <g id="page-header">
    <rect x="60" y="56" width="6" height="40" fill="#00B0F0"/>
    <text x="84" y="88" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="36" font-weight="700" fill="#0B5395">{{PAGE_TITLE}}</text>
    <text x="84" y="118" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="700" fill="#666666" letter-spacing="1.5">{{PAGE_SUBTITLE}}</text>
  </g>

  <!-- TOC List Grid (2-column layout) -->
  <g id="toc-grid">
    <!-- Item 1 (Col 1, Row 1) -->
    <g id="toc-item-1">
      <rect x="60" y="180" width="48" height="48" rx="4" fill="#0B5395"/>
      <text x="84" y="210" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">{{TOC_NUM_1}}</text>
      <text x="124" y="200" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#333333">{{TOC_TITLE_1}}</text>
      <text x="124" y="222" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">{{TOC_SUBTITLE_1}}</text>
    </g>

    <!-- Item 2 (Col 1, Row 2) -->
    <g id="toc-item-2">
      <rect x="60" y="270" width="48" height="48" rx="4" fill="#0B5395"/>
      <text x="84" y="300" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">{{TOC_NUM_2}}</text>
      <text x="124" y="290" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#333333">{{TOC_TITLE_2}}</text>
      <text x="124" y="312" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">{{TOC_SUBTITLE_2}}</text>
    </g>

    <!-- Item 3 (Col 1, Row 3) -->
    <g id="toc-item-3">
      <rect x="60" y="360" width="48" height="48" rx="4" fill="#0B5395"/>
      <text x="84" y="390" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">{{TOC_NUM_3}}</text>
      <text x="124" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#333333">{{TOC_TITLE_3}}</text>
      <text x="124" y="402" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">{{TOC_SUBTITLE_3}}</text>
    </g>

    <!-- Item 4 (Col 2, Row 1) -->
    <g id="toc-item-4">
      <rect x="660" y="180" width="48" height="48" rx="4" fill="#0B5395"/>
      <text x="684" y="210" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">{{TOC_NUM_4}}</text>
      <text x="724" y="200" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#333333">{{TOC_TITLE_4}}</text>
      <text x="724" y="222" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">{{TOC_SUBTITLE_4}}</text>
    </g>

    <!-- Item 5 (Col 2, Row 2) -->
    <g id="toc-item-5">
      <rect x="660" y="270" width="48" height="48" rx="4" fill="#0B5395"/>
      <text x="684" y="300" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">{{TOC_NUM_5}}</text>
      <text x="724" y="290" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#333333">{{TOC_TITLE_5}}</text>
      <text x="724" y="312" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">{{TOC_SUBTITLE_5}}</text>
    </g>

    <!-- Item 6 (Col 2, Row 3) -->
    <g id="toc-item-6">
      <rect x="660" y="360" width="48" height="48" rx="4" fill="#0B5395"/>
      <text x="684" y="390" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">{{TOC_NUM_6}}</text>
      <text x="724" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#333333">{{TOC_TITLE_6}}</text>
      <text x="724" y="402" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">{{TOC_SUBTITLE_6}}</text>
    </g>
  </g>

  <!-- Watermark text in background -->
  <text x="1220" y="580" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="120" font-weight="bold" fill="#666666" fill-opacity="0.04" letter-spacing="10">CONTENTS</text>

  <!-- Page Footer -->
  <g id="page-footer">
    <line x1="60" y1="650" x2="1220" y2="650" stroke="#E0E0E0" stroke-width="1"/>
    <text x="60" y="685" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">内部销售培训专用</text>
    <text x="1220" y="685" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">02</text>
  </g>
</svg>
