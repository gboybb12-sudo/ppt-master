<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <!-- Page Header -->
  <g id="page-header">
    <rect x="60" y="56" width="6" height="40" fill="#00B0F0"/>
    <text x="84" y="88" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="36" font-weight="700" fill="#0B5395">{{PAGE_TITLE}}</text>
    <text x="84" y="118" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="700" fill="#666666" letter-spacing="1.5">{{PAGE_SUBTITLE}}</text>
  </g>

  <!-- Matrix Table Layout -->
  <g id="matrix-table">
    <!-- Header Row -->
    <rect x="60" y="170" width="1160" height="50" rx="4" fill="#0B5395"/>
    <text x="110" y="202" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">{{TH_1}}</text>
    <text x="360" y="202" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">{{TH_2}}</text>
    <text x="670" y="202" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">{{TH_3}}</text>
    <text x="980" y="202" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">{{TH_4}}</text>

    <!-- Row 1 -->
    <rect x="60" y="230" width="1160" height="120" rx="6" fill="#F2F2F2" stroke="#E0E0E0" stroke-width="1"/>
    <rect x="60" y="230" width="6" height="120" rx="3" fill="#00B0F0"/>
    
    <text x="110" y="295" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B5395">{{ROW_1_COL_1}}</text>
    
    <text x="360" y="270" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#333333">
      <tspan x="360" dy="0">{{ROW_1_COL_2_L1}}</tspan>
      <tspan x="360" dy="24">{{ROW_1_COL_2_L2}}</tspan>
    </text>
    
    <text x="670" y="270" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#333333">
      <tspan x="670" dy="0">{{ROW_1_COL_3_L1}}</tspan>
      <tspan x="670" dy="24">{{ROW_1_COL_3_L2}}</tspan>
    </text>

    <text x="980" y="270" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#0B5395" font-weight="700">
      <tspan x="980" dy="0">{{ROW_1_COL_4_L1}}</tspan>
      <tspan x="980" dy="24">{{ROW_1_COL_4_L2}}</tspan>
    </text>

    <!-- Row 2 -->
    <rect x="60" y="360" width="1160" height="120" rx="6" fill="#F2F2F2" stroke="#E0E0E0" stroke-width="1"/>
    <rect x="60" y="360" width="6" height="120" rx="3" fill="#0B5395"/>
    
    <text x="110" y="425" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B5395">{{ROW_2_COL_1}}</text>
    
    <text x="360" y="400" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#333333">
      <tspan x="360" dy="0">{{ROW_2_COL_2_L1}}</tspan>
      <tspan x="360" dy="24">{{ROW_2_COL_2_L2}}</tspan>
    </text>
    
    <text x="670" y="400" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#333333">
      <tspan x="670" dy="0">{{ROW_2_COL_3_L1}}</tspan>
      <tspan x="670" dy="24">{{ROW_2_COL_3_L2}}</tspan>
    </text>

    <text x="980" y="400" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#0B5395" font-weight="700">
      <tspan x="980" dy="0">{{ROW_2_COL_4_L1}}</tspan>
      <tspan x="980" dy="24">{{ROW_2_COL_4_L2}}</tspan>
    </text>

    <!-- Row 3 -->
    <rect x="60" y="490" width="1160" height="120" rx="6" fill="#F2F2F2" stroke="#E0E0E0" stroke-width="1"/>
    <rect x="60" y="490" width="6" height="120" rx="3" fill="#00B0F0"/>
    
    <text x="110" y="555" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B5395">{{ROW_3_COL_1}}</text>
    
    <text x="360" y="530" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#333333">
      <tspan x="360" dy="0">{{ROW_3_COL_2_L1}}</tspan>
      <tspan x="360" dy="24">{{ROW_3_COL_2_L2}}</tspan>
    </text>
    
    <text x="670" y="530" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#333333">
      <tspan x="670" dy="0">{{ROW_3_COL_3_L1}}</tspan>
      <tspan x="670" dy="24">{{ROW_3_COL_3_L2}}</tspan>
    </text>

    <text x="980" y="530" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#0B5395" font-weight="700">
      <tspan x="980" dy="0">{{ROW_3_COL_4_L1}}</tspan>
      <tspan x="980" dy="24">{{ROW_3_COL_4_L2}}</tspan>
    </text>
  </g>

  <!-- Page Footer -->
  <g id="page-footer">
    <line x1="60" y1="650" x2="1220" y2="650" stroke="#E0E0E0" stroke-width="1"/>
    <text x="60" y="685" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">内部销售培训专用</text>
    <text x="1220" y="685" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">06</text>
  </g>
</svg>
