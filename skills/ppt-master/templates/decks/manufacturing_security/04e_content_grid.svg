<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <!-- Page Header -->
  <g id="page-header">
    <rect x="60" y="56" width="6" height="40" fill="#00B0F0"/>
    <text x="84" y="88" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="36" font-weight="700" fill="#0B5395">{{PAGE_TITLE}}</text>
    <text x="84" y="118" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="700" fill="#666666" letter-spacing="1.5">{{PAGE_SUBTITLE}}</text>
  </g>

  <!-- Six Grid Cards Layout -->
  <g id="grid-layout">
    <!-- Row 1, Card 1 -->
    <g id="card-1">
      <rect x="60" y="170" width="370" height="190" rx="8" fill="#F2F2F2" stroke="#E0E0E0" stroke-width="1.5"/>
      <rect x="60" y="170" width="6" height="190" rx="3" fill="#0B5395"/>
      <use data-icon="tabler-outline/server" x="80" y="186" width="24" height="24" fill="#0B5395"/>
      <text x="114" y="204" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B5395">{{GRID_TITLE_1}}</text>
      <text x="80" y="240" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#333333">
        <tspan x="80" dy="0">{{GRID_BODY_1_L1}}</tspan>
        <tspan x="80" dy="22">{{GRID_BODY_1_L2}}</tspan>
        <tspan x="80" dy="22">{{GRID_BODY_1_L3}}</tspan>
      </text>
    </g>

    <!-- Row 1, Card 2 -->
    <g id="card-2">
      <rect x="454" y="170" width="370" height="190" rx="8" fill="#F2F2F2" stroke="#E0E0E0" stroke-width="1.5"/>
      <rect x="454" y="170" width="6" height="190" rx="3" fill="#00B0F0"/>
      <use data-icon="tabler-outline/network" x="474" y="186" width="24" height="24" fill="#00B0F0"/>
      <text x="508" y="204" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B5395">{{GRID_TITLE_2}}</text>
      <text x="474" y="240" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#333333">
        <tspan x="474" dy="0">{{GRID_BODY_2_L1}}</tspan>
        <tspan x="474" dy="22">{{GRID_BODY_2_L2}}</tspan>
        <tspan x="474" dy="22">{{GRID_BODY_2_L3}}</tspan>
      </text>
    </g>

    <!-- Row 1, Card 3 -->
    <g id="card-3">
      <rect x="848" y="170" width="370" height="190" rx="8" fill="#F2F2F2" stroke="#E0E0E0" stroke-width="1.5"/>
      <rect x="848" y="170" width="6" height="190" rx="3" fill="#0B5395"/>
      <use data-icon="tabler-outline/shield-exclamation" x="868" y="186" width="24" height="24" fill="#0B5395"/>
      <text x="902" y="204" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B5395">{{GRID_TITLE_3}}</text>
      <text x="868" y="240" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#333333">
        <tspan x="868" dy="0">{{GRID_BODY_3_L1}}</tspan>
        <tspan x="868" dy="22">{{GRID_BODY_3_L2}}</tspan>
        <tspan x="868" dy="22">{{GRID_BODY_3_L3}}</tspan>
      </text>
    </g>

    <!-- Row 2, Card 4 -->
    <g id="card-4">
      <rect x="60" y="384" width="370" height="190" rx="8" fill="#F2F2F2" stroke="#E0E0E0" stroke-width="1.5"/>
      <rect x="60" y="384" width="6" height="190" rx="3" fill="#00B0F0"/>
      <use data-icon="tabler-outline/eye" x="80" y="400" width="24" height="24" fill="#00B0F0"/>
      <text x="114" y="418" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B5395">{{GRID_TITLE_4}}</text>
      <text x="80" y="454" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#333333">
        <tspan x="80" dy="0">{{GRID_BODY_4_L1}}</tspan>
        <tspan x="80" dy="22">{{GRID_BODY_4_L2}}</tspan>
        <tspan x="80" dy="22">{{GRID_BODY_4_L3}}</tspan>
      </text>
    </g>

    <!-- Row 2, Card 5 -->
    <g id="card-5">
      <rect x="454" y="384" width="370" height="190" rx="8" fill="#F2F2F2" stroke="#E0E0E0" stroke-width="1.5"/>
      <rect x="454" y="384" width="6" height="190" rx="3" fill="#0B5395"/>
      <use data-icon="tabler-outline/cloud" x="474" y="400" width="24" height="24" fill="#0B5395"/>
      <text x="508" y="418" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B5395">{{GRID_TITLE_5}}</text>
      <text x="474" y="454" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#333333">
        <tspan x="474" dy="0">{{GRID_BODY_5_L1}}</tspan>
        <tspan x="474" dy="22">{{GRID_BODY_5_L2}}</tspan>
        <tspan x="474" dy="22">{{GRID_BODY_5_L3}}</tspan>
      </text>
    </g>

    <!-- Row 2, Card 6 -->
    <g id="card-6">
      <rect x="848" y="384" width="370" height="190" rx="8" fill="#F2F2F2" stroke="#E0E0E0" stroke-width="1.5"/>
      <rect x="848" y="384" width="6" height="190" rx="3" fill="#00B0F0"/>
      <use data-icon="tabler-outline/settings" x="868" y="400" width="24" height="24" fill="#00B0F0"/>
      <text x="902" y="418" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B5395">{{GRID_TITLE_6}}</text>
      <text x="868" y="454" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#333333">
        <tspan x="868" dy="0">{{GRID_BODY_6_L1}}</tspan>
        <tspan x="868" dy="22">{{GRID_BODY_6_L2}}</tspan>
        <tspan x="868" dy="22">{{GRID_BODY_6_L3}}</tspan>
      </text>
    </g>
  </g>

  <!-- Page Footer -->
  <g id="page-footer">
    <line x1="60" y1="650" x2="1220" y2="650" stroke="#E0E0E0" stroke-width="1"/>
    <text x="60" y="685" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">内部销售培训专用</text>
    <text x="1220" y="685" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">09</text>
  </g>
</svg>
